<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hide My Email</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icon-48.png" width="40" height="40" alt="" />
        <div>
          <div class="title-row">
            <h1>Hide My Email</h1>
            <span id="version" class="version"></span>
          </div>
          <p id="status" data-state="disconnected">Checking…</p>
        </div>
      </header>
      <p id="detail">Checking connection state…</p>
      <button id="connect" type="button">Connect iCloud</button>
      <button id="disconnect" class="secondary" type="button" hidden>
        Disconnect extension
      </button>
      <p class="privacy">
        This extension calls only Apple iCloud hosts and stores only
        reconnectable service metadata.
      </p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
