name: verify

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 25.x
        uses: actions/setup-node@v7
        with:
          node-version: 25
      - name: Install npm deps
        run: npm ci
      - name: Verify formatting, lint, types, tests, and build
        run: npm run verify
